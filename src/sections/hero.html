    <section class="hero" id="top">
      <div class="hero-copy">
        <p class="where">{{ hero.where }}</p>
        <h1>{{ hero.title_html|safe }}</h1>
        <p class="lead">{{ hero.lead }}</p>
        <div class="actions">
          <a class="btn primary" href="{{ base }}Mohamed_Saeed.pdf" download>{{ hero.cv }}</a>
          <a class="btn" href="{{ site.markly }}" target="_blank" rel="noopener">{{ hero.open_markly }}</a>
          <a class="btn ghost" href="#roles">{{ hero.roles }}</a>
        </div>
      </div>

      <figure class="flow" aria-label="{{ hero.diagram_label }}">
        <svg viewBox="0 0 520 420" aria-hidden="true" dir="ltr">
          <defs>
            <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#F2B84B"/><stop offset="1" stop-color="#7FC8A9"/></linearGradient>
          </defs>
          <path id="p1" class="wire" d="M260 112 V196"/>
          <path id="p2" class="wire" d="M260 256 V340"/>
          <path id="p1b" class="wire wire-back" d="M284 196 V112"/>
          <path id="p2b" class="wire wire-back" d="M284 340 V256"/>

          <g class="node n1"><rect x="150" y="44" width="220" height="68" rx="14"/><text x="260" y="74" text-anchor="middle" class="t1">{{ hero.n1_title }}</text><text x="260" y="96" text-anchor="middle" class="t2">{{ hero.n1_sub }}</text></g>
          <g class="node n2"><rect x="150" y="196" width="220" height="60" rx="14"/><text x="260" y="224" text-anchor="middle" class="t1">{{ hero.n2_title }}</text><text x="260" y="244" text-anchor="middle" class="t2">{{ hero.n2_sub }}</text></g>
          <g class="node n3"><rect x="150" y="340" width="220" height="68" rx="14"/><text x="260" y="370" text-anchor="middle" class="t1">{{ hero.n3_title }}</text><text x="260" y="392" text-anchor="middle" class="t2">{{ hero.n3_sub }}</text></g>

          <circle r="6" fill="url(#g)" class="pkt" opacity="0"><animateMotion dur="2.6s" repeatCount="indefinite" begin="0.4s"><mpath href="#p1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="2.6s" begin="0.4s" repeatCount="indefinite"/></circle>
          <circle r="6" fill="url(#g)" class="pkt" opacity="0"><animateMotion dur="2.6s" repeatCount="indefinite" begin="1.0s"><mpath href="#p2"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="2.6s" begin="1.0s" repeatCount="indefinite"/></circle>
          <circle r="5" fill="#7FC8A9" class="pkt" opacity="0"><animateMotion dur="2.6s" repeatCount="indefinite" begin="1.6s"><mpath href="#p2b"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="2.6s" begin="1.6s" repeatCount="indefinite"/></circle>
          <circle r="5" fill="#7FC8A9" class="pkt" opacity="0"><animateMotion dur="2.6s" repeatCount="indefinite" begin="2.2s"><mpath href="#p1b"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="2.6s" begin="2.2s" repeatCount="indefinite"/></circle>
        </svg>
        <figcaption>{{ hero.caption }}</figcaption>
      </figure>
    </section>
