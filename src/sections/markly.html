    <section class="markly" id="markly">
      <div class="sec-head">
        <h2>{{ markly.title }}</h2>
        <p>{{ markly.intro }}</p>
      </div>
      <div class="markly-grid">
        <ol class="steps">
{% for s in steps %}
          <li><strong>{{ s.title }}</strong><span>{{ s.desc }}</span></li>
{% endfor %}
        </ol>
        <aside class="stackbox">
          <h3>{{ markly.stack_title }}</h3>
          <p>{{ markly.stack }}</p>
          <h3>{{ markly.v1_title }}</h3>
          <p>{{ markly.v1 }}</p>
          <a class="btn primary" href="{{ site.markly }}" target="_blank" rel="noopener">{{ markly.open }}</a>
        </aside>
      </div>
    </section>
